name: Deploy GandoGames (Staging)

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - 'site/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: Run tests
        working-directory: site
        run: |
          if find src -name "*.spec.ts" | grep -q .; then
            npm test
          else
            echo "No tests found, skipping"
          fi

      - run: npm run build
        working-directory: site

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_MUSHROOM_027658110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/dist/GandoGames/browser
          skip_app_build: true
          deployment_environment: staging
