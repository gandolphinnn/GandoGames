<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — Pankov: Rolled</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --accent-muted:rgba(200,130,30,0.12);
  --success:#18b150;--success-bg:rgba(74,222,128,0.12);--success-border:rgba(74,222,128,0.2);
  --danger:#e62323;--danger-bg:rgba(248,113,113,0.1);--danger-border:rgba(248,113,113,0.3);
  --warning:#f59e0b;--warning-bg:rgba(245,158,11,0.12);--warning-border:rgba(245,158,11,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto;display:flex;justify-content:center}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.online-count{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 .75rem;border:1px solid var(--border);border-radius:10px;font-size:.875rem;color:var(--text-muted)}
.online-count .dot{color:var(--success);font-size:.6em}
.my-room-card{display:inline-flex;align-items:center;gap:.5rem;height:36px;padding:0 1rem;background:var(--success-bg);border:1px solid var(--success-border);border-radius:9999px;color:var(--success);font-size:.875rem;font-weight:500;cursor:pointer}
.my-room-card .live{font-size:.65em;font-weight:700;letter-spacing:.05em;background:var(--success);color:#fff;border-radius:6px;padding:1px 5px}
.game-shell{display:flex;flex-direction:column;gap:1rem;padding:1rem;max-width:600px;margin:0 auto;width:100%;flex:1}
.game-header{display:flex;align-items:center;gap:.75rem}
.game-back{background:none;border:none;color:var(--text-muted);font-size:.875rem;cursor:pointer;padding:0;min-height:44px;font-family:inherit;display:inline-flex;align-items:center;gap:.5rem}
.game-title{font-size:1.25rem;font-weight:700}
.players-strip{display:flex;gap:.5rem;flex-wrap:wrap}
.player-chip{padding:.375rem .875rem;background:var(--bg-card);border:1px solid var(--border);border-radius:9999px;font-size:.875rem;display:flex;align-items:center;gap:.5rem}
.player-chip.host{border-color:var(--accent)}
.lives{color:var(--danger);font-weight:600;font-size:.8em}
.game-panel{flex:1;display:flex;align-items:center;justify-content:center}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;width:100%;display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.panel-eyebrow{font-size:.875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.panel-claim{font-size:2rem;font-weight:800;color:var(--success);line-height:1}
.hint{font-size:.875rem;color:var(--text-muted)}
.declare-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;width:100%}
.declare-btn{height:60px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.875rem;font-weight:700;cursor:pointer;transition:background 200ms,border-color 200ms,transform 200ms;font-family:inherit;text-decoration:none;display:flex;align-items:center;justify-content:center}
.declare-btn:hover{background:var(--accent-muted);border-color:var(--accent);transform:translateY(-2px)}
.declare-btn.honest{border-color:var(--success)}
.declare-btn.honest:hover{background:var(--success-bg);border-color:var(--success)}
.declare-btn.pankov{border-color:var(--warning);color:var(--warning)}
.declare-btn.pankov:hover{background:var(--warning-bg);border-color:var(--warning)}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center">
    <button class="my-room-card">
      <i class="fa-solid fa-circle-dot" style="font-size:.55em"></i> QK7X2M
      <span class="live">LIVE</span>
    </button>
  </div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="online-count"><i class="fa-solid fa-circle-dot dot"></i> 5</span>
    </nav>
  </div>
</header>

<div class="game-shell">
  <div class="game-header">
    <button class="game-back"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <h1 class="game-title">Pankov</h1>
  </div>

  <div class="players-strip">
    <div class="player-chip host">
      Gandolphinnn <span class="lives">❤❤❤</span>
    </div>
    <div class="player-chip">
      Alice <span class="lives">❤❤❤</span>
    </div>
    <div class="player-chip">
      Bob <span class="lives" style="color:#f59e0b">❤❤</span>
    </div>
  </div>

  <div class="game-panel">
    <div class="panel">
      <p class="panel-eyebrow">You rolled</p>
      <p class="panel-claim">16</p>
      <p class="hint">Must declare higher than 15</p>
      <div class="declare-grid">
        <a href="game-pankov-result.html" class="declare-btn">16</a>
        <a href="game-pankov-result.html" class="declare-btn honest">16 ✓</a>
        <a href="game-pankov-result.html" class="declare-btn">17</a>
        <a href="game-pankov-result.html" class="declare-btn">18</a>
        <a href="game-pankov-result.html" class="declare-btn">19</a>
        <a href="game-pankov-result.html" class="declare-btn">20</a>
        <a href="game-pankov-result.html" class="declare-btn pankov">21 ☠</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
