<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --hover-overlay:rgba(255,200,100,0.06);
  --success:#18b150;--success-bg:rgba(74,222,128,0.12);--success-border:rgba(74,222,128,0.2);
  --danger:#e62323;--danger-bg:rgba(248,113,113,0.1);
  --danger-muted:rgba(248,113,113,0.15);--danger-dim:rgba(248,113,113,0.2);--danger-border:rgba(248,113,113,0.3);
  --warning:#f59e0b;--warning-bg:rgba(245,158,11,0.12);--warning-border:rgba(245,158,11,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem;transition:color 200ms}
.nav-link:hover{color:var(--text)}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.online-count{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 .75rem;border:1px solid var(--border);border-radius:10px;font-size:.875rem;color:var(--text-muted)}
.online-count .dot{color:var(--success);font-size:.6em}
/* Profile page */
.profile-page{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.profile-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:100%;max-width:400px;display:flex;flex-direction:column;gap:1.5rem}
.profile-header{display:flex;align-items:center;gap:.75rem}
.profile-title{font-size:1.5rem;font-weight:700}
.profile-info{display:flex;flex-direction:column;gap:.75rem}
.info-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-label{font-size:.875rem;color:var(--text-muted)}
.info-value{font-size:.875rem;font-family:monospace;word-break:break-all}
.btn{padding:.75rem 1.5rem;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:background 200ms;min-height:44px;display:inline-flex;align-items:center;gap:.5rem;font-family:inherit}
.btn-danger{background:var(--danger-muted);color:var(--danger);border:1px solid var(--danger-border)}
.btn-danger:hover{background:var(--danger-dim)}
.btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger-border)}
.btn-danger-outline:hover{background:var(--danger-bg)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--hover-overlay)}
.danger-zone{display:flex;flex-direction:column;gap:.75rem;padding-top:1rem;border-top:1px solid var(--danger-dim)}
.danger-zone-title{font-size:.875rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.danger-zone-actions{display:flex;gap:.75rem;flex-wrap:wrap}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center"></div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="online-count"><i class="fa-solid fa-circle-dot dot"></i> 3</span>
    </nav>
  </div>
</header>

<div class="profile-page">
  <div class="profile-card">
    <div class="profile-header">
      <h1 class="profile-title">Profile</h1>
    </div>

    <div class="profile-info">
      <div class="info-row">
        <span class="info-label">PlayFab ID</span>
        <span class="info-value">A1B2C3D4E5F6</span>
      </div>
      <div class="info-row">
        <span class="info-label">Username</span>
        <span class="info-value">Gandolphinnn</span>
      </div>
    </div>

    <button class="btn btn-danger">
      <i class="fa-solid fa-sign-out-alt"></i> Log out
    </button>

    <div class="danger-zone">
      <p class="danger-zone-title">Danger zone</p>
      <button class="btn btn-danger-outline">
        <i class="fa-solid fa-trash"></i> Delete account
      </button>
    </div>
  </div>
</div>
</body>
</html>
