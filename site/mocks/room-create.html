<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — New Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --accent-subtle:rgba(200,130,30,0.08);
  --accent-emphasis:rgba(200,130,30,0.35);
  --shadow-hover:0 8px 24px rgba(0,0,0,0.35);
  --success:#18b150;--success-bg:rgba(74,222,128,0.12);--success-border:rgba(74,222,128,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem}
.nav-link:hover{color:var(--text)}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.online-count{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 .75rem;border:1px solid var(--border);border-radius:10px;font-size:.875rem;color:var(--text-muted)}
.online-count .dot{color:var(--success);font-size:.6em}
/* Create form */
.rooms-page{padding:1.5rem;max-width:720px;margin:0 auto;width:100%}
.create-form{display:flex;flex-direction:column;gap:1.5rem}
.form-title{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.form-subtitle{font-size:.875rem;color:var(--text-muted)}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.game-card{display:flex;flex-direction:column;align-items:flex-start;gap:.75rem;padding:1.5rem;background:var(--bg-card);border:2px solid var(--border);border-radius:16px;cursor:pointer;text-align:left;transition:border-color 200ms,background 200ms,transform 200ms,box-shadow 200ms;font-family:inherit}
.game-card:hover{border-color:var(--accent-emphasis);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.game-card.selected{border-color:var(--accent);background:var(--accent-subtle);box-shadow:0 0 0 1px var(--accent),var(--shadow-hover)}
.game-card-icon{font-size:2.25rem;line-height:1;color:var(--accent)}
.game-card-name{font-weight:700;font-size:1.25rem;color:var(--text)}
.game-card-desc{font-size:.875rem;color:var(--text-muted);line-height:1.5;flex:1}
.game-card-players{font-size:.875rem;color:var(--accent);font-weight:600}
.form-actions{display:flex;gap:.75rem}
.btn{padding:.75rem 1.5rem;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:background 200ms;min-height:44px;display:inline-flex;align-items:center;font-family:inherit;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-secondary:hover{color:var(--text);border-color:var(--text-muted)}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center"></div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="online-count"><i class="fa-solid fa-circle-dot dot"></i> 5</span>
    </nav>
  </div>
</header>

<div class="rooms-page">
  <div class="create-form">
    <div>
      <h2 class="form-title">New Room</h2>
      <p class="form-subtitle">Pick a game to play</p>
    </div>

    <div class="game-grid">
      <button class="game-card selected">
        <i class="fa-solid fa-hand-back-fist game-card-icon"></i>
        <span class="game-card-name">Morra</span>
        <span class="game-card-desc">A classic hand game where you pick a hand signal and guess the total shown by all players.</span>
        <span class="game-card-players">2–4 players</span>
      </button>
      <button class="game-card">
        <i class="fa-solid fa-dice game-card-icon"></i>
        <span class="game-card-name">Pankov</span>
        <span class="game-card-desc">Roll a die, then declare a value — honest or a bluff. Challenge others before they call yours.</span>
        <span class="game-card-players">2–6 players</span>
      </button>
    </div>

    <div class="form-actions">
      <a href="rooms.html" class="btn btn-secondary">Cancel</a>
      <a href="room-lobby.html" class="btn btn-primary">Create Room</a>
    </div>
  </div>
</div>
</body>
</html>
