<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — Room Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --hover-overlay:rgba(255,200,100,0.06);
  --success:#18b150;--success-bg:rgba(74,222,128,0.12);--success-border:rgba(74,222,128,0.2);
  --danger:#e62323;--danger-bg:rgba(248,113,113,0.1);--danger-border:rgba(248,113,113,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto;display:flex;justify-content:center}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem}
.nav-link:hover{color:var(--text)}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.online-count{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 .75rem;border:1px solid var(--border);border-radius:10px;font-size:.875rem;color:var(--text-muted)}
.online-count .dot{color:var(--success);font-size:.6em}
/* My room card in navbar */
.my-room-card{display:inline-flex;align-items:center;gap:.5rem;height:36px;padding:0 1rem;background:var(--success-bg);border:1px solid var(--success-border);border-radius:9999px;color:var(--success);font-size:.875rem;font-weight:500;cursor:pointer;border:none}
.my-room-card i{font-size:.55em}
/* Room detail */
.room-detail{padding:1.5rem;max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:1.5rem}
.room-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.back-link{color:var(--text-muted);text-decoration:none;font-size:.875rem;min-height:44px;display:inline-flex;align-items:center;gap:.5rem;transition:color 200ms}
.back-link:hover{color:var(--text)}
.code-btn{padding:.5rem .75rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:.875rem;cursor:pointer;min-height:44px;font-family:monospace;transition:color 200ms}
.players-strip{display:flex;gap:.5rem;flex-wrap:wrap}
.player-chip{padding:.5rem .75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:9999px;font-size:.875rem;display:flex;align-items:center;gap:.5rem}
.player-chip.host{border-color:var(--accent)}
.player-chip.me{font-weight:600}
.badge{font-size:.65rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.kick-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;margin-left:.25rem;background:transparent;border:1px solid transparent;border-radius:9999px;color:var(--text-muted);font-size:.65rem;cursor:pointer;transition:color 200ms,border-color 200ms,background 200ms}
.kick-btn:hover{color:var(--danger);border-color:var(--danger-border);background:var(--danger-bg)}
.phase-panel{display:flex;flex-direction:column;gap:1rem}
.status-msg{color:var(--text-muted);font-size:.875rem}
.hint{font-size:.875rem;color:var(--text-muted)}
.btn{padding:.75rem 1.5rem;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:background 200ms;min-height:44px;display:inline-flex;align-items:center;gap:.5rem;font-family:inherit;align-self:flex-start;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger-border)}
.btn-danger:hover{background:var(--danger-bg)}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center">
    <button class="my-room-card">
      <i class="fa-solid fa-circle-dot"></i> QK7X2M
    </button>
  </div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="online-count"><i class="fa-solid fa-circle-dot dot"></i> 5</span>
    </nav>
  </div>
</header>

<div class="room-detail">
  <div class="room-header">
    <a href="rooms.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
    <button class="code-btn">QK7X2M <i class="fa-regular fa-copy"></i></button>
  </div>

  <div class="players-strip">
    <div class="player-chip host me">
      Gandolphinnn <span class="badge">HOST</span> <span class="badge">YOU</span>
    </div>
    <div class="player-chip">
      Alice
      <button class="kick-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <div class="phase-panel">
    <p class="status-msg">Waiting for players…</p>
    <a href="game-morra-pick.html" class="btn btn-primary">Start Game</a>
    <button class="btn btn-danger">Leave Room</button>
  </div>
</div>
</body>
</html>
