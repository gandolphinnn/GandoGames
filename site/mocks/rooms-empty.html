<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — Rooms (empty)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --success:#18b150;--success-bg:rgba(74,222,128,0.12);--success-border:rgba(74,222,128,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem}
.nav-link:hover{color:var(--text)}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.online-count{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 .75rem;border:1px solid var(--border);border-radius:10px;font-size:.875rem;color:var(--text-muted)}
.online-count .dot{color:var(--success);font-size:.6em}
.rooms-page{padding:1.5rem;max-width:720px;margin:0 auto;width:100%}
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filter-btn{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:9999px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.875rem;cursor:pointer;min-height:44px;font-family:inherit}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:.75rem;padding:2rem 0}
.empty-icon{font-size:2.5rem;line-height:1;color:var(--text-muted)}
.empty-title{font-size:1.25rem;font-weight:700}
.empty-subtitle{font-size:.875rem;color:var(--text-muted);margin-top:-.25rem}
.btn-primary{padding:.75rem 1.5rem;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;min-height:44px;transition:background 200ms;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn-primary:hover{background:var(--accent-hover)}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center"></div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="online-count"><i class="fa-solid fa-circle-dot dot"></i> 1</span>
    </nav>
  </div>
</header>

<div class="rooms-page">
  <div class="filter-bar">
    <button class="filter-btn active"><i class="fa-solid fa-hand-back-fist"></i> Morra</button>
    <button class="filter-btn"><i class="fa-solid fa-dice"></i> Pankov</button>
  </div>

  <div class="empty-state">
    <i class="fa-solid fa-gamepad empty-icon"></i>
    <p class="empty-title">No open rooms</p>
    <p class="empty-subtitle">Create one and invite your friends.</p>
    <a href="room-create.html" class="btn-primary">+ New Room</a>
  </div>
</div>
</body>
</html>
