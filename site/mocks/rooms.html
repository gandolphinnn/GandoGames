<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --hover-overlay:rgba(255,200,100,0.06);
  --accent-tint:rgba(200,130,30,0.04);
  --accent-subtle:rgba(200,130,30,0.08);
  --accent-emphasis:rgba(200,130,30,0.35);
  --shadow-hover:0 8px 24px rgba(0,0,0,0.35);
  --success:#18b150;--success-bg:rgba(74,222,128,0.12);--success-border:rgba(74,222,128,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto;display:flex;justify-content:center}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem;transition:color 200ms}
.nav-link:hover{color:var(--text)}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.online-count{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 .75rem;border:1px solid var(--border);border-radius:10px;font-size:.875rem;color:var(--text-muted)}
.online-count .dot{color:var(--success);font-size:.6em}
/* Rooms page */
.rooms-page{padding:1.5rem;max-width:720px;margin:0 auto;width:100%}
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filter-btn{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:9999px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.875rem;cursor:pointer;transition:background 200ms,color 200ms,border-color 200ms;min-height:44px;font-family:inherit}
.filter-btn:hover{color:var(--text);border-color:var(--text-muted)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.room-list-wrap{display:flex;flex-direction:column;gap:1rem}
.room-list{list-style:none;display:flex;flex-direction:column;gap:.75rem}
.room-card{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color 200ms,background 200ms;min-height:44px;text-decoration:none;color:inherit}
.room-card:hover{border-color:var(--accent);background:var(--accent-tint)}
.room-card-info{display:flex;flex-direction:column;gap:.25rem}
.room-card-game{font-weight:600;font-size:1rem}
.room-card-players-list{font-size:.875rem;color:var(--text-muted)}
.room-card-count{font-size:.875rem;color:var(--accent);font-weight:600;white-space:nowrap}
.btn-primary{padding:.75rem 1.5rem;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;align-self:flex-start;min-height:44px;transition:background 200ms;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn-primary:hover{background:var(--accent-hover)}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center"></div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="online-count"><i class="fa-solid fa-circle-dot dot"></i> 5</span>
    </nav>
  </div>
</header>

<div class="rooms-page">
  <div class="filter-bar">
    <button class="filter-btn active"><i class="fa-solid fa-hand-back-fist"></i> Morra</button>
    <button class="filter-btn"><i class="fa-solid fa-dice"></i> Pankov</button>
  </div>

  <div class="room-list-wrap">
    <ul class="room-list">
      <li>
        <a href="room-lobby.html" class="room-card">
          <div class="room-card-info">
            <span class="room-card-game">Morra</span>
            <span class="room-card-players-list">Gandolphinnn, Alice</span>
          </div>
          <span class="room-card-count">2&thinsp;/&thinsp;4</span>
        </a>
      </li>
      <li>
        <a href="room-lobby.html" class="room-card">
          <div class="room-card-info">
            <span class="room-card-game">Morra</span>
            <span class="room-card-players-list">Bob</span>
          </div>
          <span class="room-card-count">1&thinsp;/&thinsp;4</span>
        </a>
      </li>
      <li>
        <a href="room-lobby.html" class="room-card">
          <div class="room-card-info">
            <span class="room-card-game">Pankov</span>
            <span class="room-card-players-list">Charlie, Dana, Eve</span>
          </div>
          <span class="room-card-count">3&thinsp;/&thinsp;6</span>
        </a>
      </li>
    </ul>
    <a href="room-create.html" class="btn-primary">+ New Room</a>
  </div>
</div>
</body>
</html>
