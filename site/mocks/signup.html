<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GandoGames — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
  --bg:#110c06;--bg-surface:#1c1408;--bg-card:#271c0e;
  --accent:#c8821e;--accent-hover:#e0971f;
  --text:#f2e4c8;--text-muted:#9e8060;
  --border:rgba(180,110,40,0.12);
  --danger:#e62323;--danger-bg:rgba(248,113,113,0.1);
  --danger-dim:rgba(248,113,113,0.2);--danger-border:rgba(248,113,113,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.site-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.site-header-start,.site-header-end{flex:1;min-width:0}
.site-header-end{display:flex;align-items:center;justify-content:flex-end}
.site-header-center{flex:0 0 auto}
.site-nav{display:flex;align-items:center;gap:1rem}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:.875rem;transition:color 200ms}
.nav-link:hover{color:var(--text)}
.nav-link.title{font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.theme-toggle{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.auth-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:100%;max-width:400px;display:flex;flex-direction:column;gap:1rem}
.auth-title{font-size:1.5rem;font-weight:700}
.auth-subtitle{font-size:.875rem;color:var(--text-muted);margin-top:-.5rem}
.auth-form{display:flex;flex-direction:column;gap:1rem}
.field{display:flex;flex-direction:column;gap:.25rem}
.field-label{font-size:.875rem;color:var(--text-muted)}
.input{padding:.75rem 1rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none;min-height:44px;font-family:inherit;width:100%}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text-muted)}
.btn{padding:.75rem 1.5rem;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:background 200ms;min-height:44px;display:inline-flex;align-items:center;justify-content:center;width:100%;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.auth-footer{font-size:.875rem;color:var(--text-muted);text-align:center}
.auth-link{color:var(--accent);text-decoration:none}
.auth-link:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-start">
    <a href="rooms.html" class="nav-link title">GandoGames</a>
  </div>
  <div class="site-header-center"></div>
  <div class="site-header-end">
    <nav class="site-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="login.html" class="nav-link">Log in</a>
      <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
    </nav>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Join GandoGames</p>

    <form class="auth-form" onsubmit="return false">
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input id="username" class="input" type="text" placeholder="YourName" autocomplete="username" />
      </div>
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input id="password" class="input" type="password" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <a href="rooms.html" class="btn btn-primary" style="text-decoration:none;justify-content:center">Create account</a>
    </form>

    <p class="auth-footer">Already have an account? <a class="auth-link" href="login.html">Log in</a></p>
  </div>
</div>
</body>
</html>
