<ion-app>
	<ion-menu contentId="main-content" menuId="main-menu" type="overlay" [disabled]="!isLoggedIn()">
		<ion-header>
			<ion-toolbar>
				<ion-title>
					<a class="menu-brand" routerLink="/">
						<img src="icons/favicon.png" alt="" class="menu-brand-img" />
						GandoGames
					</a>
				</ion-title>
			</ion-toolbar>
		</ion-header>
		<ion-content>
			@if (user(); as u) {
				<div class="menu-user">
					<gg-player-avatar class="menu-user-avatar" [player]="u.player" />
					<div class="menu-user-info">
						<span class="menu-user-name">{{ u.player.name }}</span>
						@if (u.isGuest) {
							<span class="menu-user-badge">Guest</span>
						}
					</div>
				</div>
			}

			<ion-list lines="none">
				<ion-item button detail="false" routerLink="/play" routerLinkActive="menu-item-active"
					(click)="closeMenu()">
					<ion-icon name="game-controller" slot="start" />
					<ion-label>Play</ion-label>
				</ion-item>
				<ion-item button detail="false" routerLink="/social" routerLinkActive="menu-item-active"
					(click)="closeMenu()">
					<ion-icon name="people" slot="start" />
					<ion-label>Social</ion-label>
				</ion-item>
				<ion-item button detail="false" routerLink="/profile" routerLinkActive="menu-item-active"
					(click)="closeMenu()">
					<ion-icon name="person" slot="start" />
					<ion-label>Profile</ion-label>
				</ion-item>
				<ion-item button detail="false" routerLink="/about" routerLinkActive="menu-item-active"
					(click)="closeMenu()">
					<ion-icon name="information-circle" slot="start" />
					<ion-label>About</ion-label>
				</ion-item>
			</ion-list>

			@if (myRooms().length > 0) {
				<div class="menu-rooms">
					<p class="menu-section-label">Active Rooms</p>
					@for (room of myRooms(); track room.id) {
						<button class="menu-room-item" (click)="goToRoom(room.id)">
							<span class="menu-room-id">{{ room.id }}</span>
							<span class="menu-room-game">{{ gameLabel(room.game) }}</span>
							@if (room.phase === 'playing') {
								<span class="menu-room-live">LIVE</span>
							}
						</button>
					}
				</div>
			}
		</ion-content>
	</ion-menu>

	<ion-router-outlet id="main-content" />
	<gg-toast />
</ion-app>
