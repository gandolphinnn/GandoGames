<ion-app>
	<!-- On the room list the menu is pinned beside the content on desktop (split pane);
	     everywhere else `when` is false, so it falls back to the usual overlay drawer. -->
	<ion-split-pane contentId="main-content" [when]="menuWhen()">
		<ion-menu contentId="main-content" menuId="main-menu" type="overlay" [disabled]="!isLoggedIn()">
			<gg-side-menu />
		</ion-menu>

		<ion-router-outlet id="main-content" />
	</ion-split-pane>
	<gg-toast />
</ion-app>
