@if (currentRoom()) {

	<!-- FAB trigger -->
	<button class="chat-fab" (click)="toggle()" type="button" title="Open chat">
		<i class="fa-solid fa-comments"></i>
		@if (unread() > 0) {
			<span class="chat-fab-badge">{{ unread() }}</span>
		}
	</button>

	<!-- Bottom-sheet modal -->
	<ion-modal
		[isOpen]="open()"
		(didDismiss)="close()"
		[breakpoints]="[0, 0.75, 1]"
		[initialBreakpoint]="0.75"
		[canDismiss]="true"
	>
		<ng-template>
			<ion-header>
				<ion-toolbar>
					<ion-title>Room Chat</ion-title>
					<ion-buttons slot="end">
						<ion-button (click)="close()">
							<ion-icon slot="icon-only" name="close-outline"></ion-icon>
						</ion-button>
					</ion-buttons>
				</ion-toolbar>
			</ion-header>

			<ion-content>
				<div class="chat-messages" #messageList>
					@for (msg of messages(); track msg.playerId + msg.timestamp) {
						<div class="chat-msg" [class.is-mine]="msg.playerId === myId()">
							<span class="chat-msg-name">{{ msg.playerName }}</span>
							<span class="chat-msg-text">{{ msg.text }}</span>
							<span class="chat-msg-time">{{ msg.timestamp | date:'HH:mm' }}</span>
						</div>
					} @empty {
						<p class="chat-empty">No messages yet.</p>
					}
				</div>
			</ion-content>

			<ion-footer>
				<ion-toolbar>
					<div class="chat-input-row">
						<input
							class="chat-input"
							type="text"
							placeholder="Message…"
							[ngModel]="text()"
							(ngModelChange)="text.set($event)"
							(keydown)="onKeydown($event)"
							maxlength="500"
							autocomplete="off"
						/>
						<button
							class="chat-send"
							type="button"
							(click)="send()"
							[disabled]="sending() || !text().trim()"
							title="Send"
						>
							<i class="fa-solid fa-paper-plane"></i>
						</button>
					</div>
				</ion-toolbar>
			</ion-footer>
		</ng-template>
	</ion-modal>

}
