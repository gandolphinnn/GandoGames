<div class="backdrop" (click)="onBackdropClick()"></div>

<div class="modal" (click)="$event.stopPropagation()">

	<header class="modal-header">
		<h2 class="modal-title">Room access</h2>
		<button class="modal-close" (click)="closed.emit()" title="Close">
			<ion-icon name="close" />
		</button>
	</header>

	<div class="modal-body">
		@if (!editable()) {
			<p class="empty-msg">Only the host can change room access.</p>
		}

		<ul class="access-list">
			@for (opt of options; track opt.value) {
				<li>
					<button
						type="button"
						class="access-option"
						[class.selected]="selected() === opt.value"
						[disabled]="!editable()"
						(click)="choose(opt.value)">
						<ion-icon class="access-option-icon" [name]="opt.icon" />
						<span class="access-option-text">
							<span class="access-option-label">{{ opt.label }}</span>
							<span class="access-option-desc">{{ opt.description }}</span>
						</span>
						@if (selected() === opt.value) {
							<ion-icon class="access-option-check" name="checkmark" />
						}
					</button>
				</li>
			}
		</ul>
	</div>

	@if (editable()) {
		<footer class="modal-footer">
			<button class="btn-primary" [disabled]="saving()" (click)="save()">{{ saving() ? 'Saving…' : 'Save' }}</button>
		</footer>
	}

</div>
