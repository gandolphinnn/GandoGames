@if (user(); as u) {
	<div class="profile-page">
		<div class="profile-card">
			<div class="profile-header">
				<h1 class="profile-title">Profile</h1>
				@if (u.isGuest) {
					<span class="profile-badge">Guest</span>
				}
			</div>

			<div class="profile-info">
				<div class="info-row">
					<span class="info-label">PlayFab ID</span>
					<span class="info-value">{{ u.player.id }}</span>
				</div>
				<div class="info-row">
					<span class="info-label">Username</span>
					<span class="info-value">{{ u.player.name }}</span>
				</div>
			</div>

			@if (error()) {
				<p class="profile-error">{{ error() }}</p>
			}

			<button class="btn btn-danger" type="button" (click)="logout()">
				<i class="fa-solid fa-sign-out-alt"></i> Log out
			</button>

			<div class="danger-zone">
				<p class="danger-zone-title">Danger zone</p>
				@if (!confirmingDelete()) {
					<button class="btn btn-danger-outline" type="button" (click)="requestDelete()">
						<i class="fa-solid fa-trash"></i> Delete account
					</button>
				} @else {
					<p class="danger-zone-warn">This will permanently delete your account. This cannot be undone.</p>
					<div class="danger-zone-actions">
						<button class="btn btn-danger" type="button" [disabled]="loading()" (click)="confirmDelete()">
							<i class="fa-solid fa-trash"></i> {{ loading() ? 'Deleting…' : 'Yes, delete' }}
						</button>
						<button class="btn btn-ghost" type="button" [disabled]="loading()" (click)="cancelDelete()">
							Cancel
						</button>
					</div>
				}
			</div>

		</div>
	</div>
}
