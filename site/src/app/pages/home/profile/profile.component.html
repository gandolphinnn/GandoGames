<ion-header [translucent]="true">
	<ion-toolbar>
		<ion-buttons slot="start">
			<ion-menu-button />
		</ion-buttons>
		<ion-title>Profile</ion-title>
		<ion-buttons slot="end">
			<ion-button title="Logout" (click)="logout()">
				<ion-icon slot="icon-only" name="log-out-outline" />
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
	@if (user(); as u) {
		<div class="profile-wrap">
			<ion-card class="profile-card">

				<div class="profile-top">
					<div class="avatar-wrapper">
						<gg-player-avatar class="profile-avatar" [player]="u.player" />
					</div>
					<span class="profile-name">{{ u.player.name }}</span>
					@if (u.isGuest) {
						<span class="guest-badge">Guest</span>
					}
				</div>

				<div class="settings-list">
					<div class="setting-row">
						<div class="setting-label">
							<ion-icon name="contrast-outline" />
							<span>Theme</span>
						</div>
						<ion-segment [value]="isDark() ? 'dark' : 'light'" (ionChange)="setTheme($event.detail.value!)">
							<ion-segment-button value="light">
								<ion-icon name="sunny-outline" />
							</ion-segment-button>
							<ion-segment-button value="dark">
								<ion-icon name="moon-outline" />
							</ion-segment-button>
						</ion-segment>
					</div>
					<div class="setting-row">
						<div class="setting-label">
							<ion-icon name="language-outline" />
							<span>Language</span>
						</div>
						<ion-select [value]="u.player.language" interface="popover" (ionChange)="setLanguage($event.detail.value)">
							@for (lang of languages; track lang.value) {
								<ion-select-option [value]="lang.value">{{ lang.text }}</ion-select-option>
							}
						</ion-select>
					</div>
					<div class="setting-row setting-row-stacked">
						<div class="setting-label">
							<span>Avatar</span>
						</div>
						<div class="icon-picker">
							@for (icon of icons; track icon.id) {
								<button
									class="icon-btn"
									[class.selected]="u.player.icon === icon.id"
									type="button"
									[attr.aria-label]="icon.label"
									(click)="setIcon(icon.id)"
								>
									<gg-player-avatar [player]="withIcon(u.player, icon.id)" />
								</button>
							}
						</div>
					</div>
				</div>

				<div class="delete-section">
					<ion-button fill="outline" color="danger" expand="block" [disabled]="loading()" (click)="deleteAccount()">
						<ion-icon name="trash-outline" slot="start" />
						{{ loading() ? 'Deleting…' : 'Delete account' }}
					</ion-button>
				</div>

			</ion-card>
		</div>
	}
</ion-content>
