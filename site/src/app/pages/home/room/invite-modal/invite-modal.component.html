<div class="backdrop" (click)="onBackdropClick()"></div>

<div class="modal" (click)="$event.stopPropagation()">

	<header class="modal-header">
		<h2 class="modal-title">Invite to Room</h2>
		<button class="modal-close" (click)="closed.emit()" title="Close">
			<ion-icon name="close" />
		</button>
	</header>

	<div class="modal-body">

		@if (canAddBot()) {
			<section class="invite-section">
				<h3 class="section-label">Add a bot</h3>
				<div class="player-row">
					<div class="player-row-avatar bot-avatar">
						<ion-icon name="hardware-chip" />
					</div>
					<span class="player-row-name">Bot player</span>
					<button class="btn-row-action" [disabled]="addingBot()" (click)="addBot()">
						@if (addingBot()) {
							<ion-icon name="sync" class="spin" />
						} @else {
							Add
						}
					</button>
				</div>
			</section>
		}

		@if (error()) {
			<p class="modal-error">{{ error() }}</p>
		}

	</div>

</div>
