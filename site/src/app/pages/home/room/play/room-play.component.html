<div class="game-layout">
	<gg-game-history [entries]="history()" />
	<div class="game-shell">
		<header class="game-header">
			<button class="game-back" (click)="backToLobby()"><i class="fa-solid fa-arrow-left"></i> Back</button>
			<h1 class="game-title">{{ gameTitle() }}</h1>
		</header>
		<ng-container #gameSlot />
	</div>
</div>
