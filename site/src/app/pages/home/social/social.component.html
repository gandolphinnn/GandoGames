@if (device.isMobile()) {

	<ion-header>
		<ion-toolbar>
			<ion-title>Social</ion-title>
		</ion-toolbar>
	</ion-header>

	<ion-content>
		<ion-list>
			<ion-list-header>
				<ion-label>Friend Requests</ion-label>
			</ion-list-header>
			<ion-item>
				<ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
				<ion-label color="medium">No pending friend requests</ion-label>
			</ion-item>
		</ion-list>

		<ion-list>
			<ion-list-header>
				<ion-label>Invites</ion-label>
			</ion-list-header>
			<ion-item>
				<ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
				<ion-label color="medium">No pending invites</ion-label>
			</ion-item>
		</ion-list>

		<ion-list>
			<ion-list-header>
				<ion-label>Friends</ion-label>
			</ion-list-header>
			<ion-item>
				<ion-icon name="people-outline" slot="start" color="medium"></ion-icon>
				<ion-label color="medium">No friends yet</ion-label>
			</ion-item>
		</ion-list>
	</ion-content>

} @else {

	<div class="social-page">
		<div class="social-content">
			<h1 class="social-title">Social</h1>

			<div class="social-section">
				<h2 class="section-title">
					<i class="fa-solid fa-user-plus"></i>
					Friend Requests
				</h2>
				<div class="empty-state">
					<i class="fa-solid fa-inbox empty-state-icon"></i>
					<p class="empty-state-text">No pending friend requests</p>
				</div>
			</div>

			<div class="social-section">
				<h2 class="section-title">
					<i class="fa-solid fa-envelope"></i>
					Invites
				</h2>
				<div class="empty-state">
					<i class="fa-solid fa-inbox empty-state-icon"></i>
					<p class="empty-state-text">No pending invites</p>
				</div>
			</div>

			<div class="social-section">
				<h2 class="section-title">
					<i class="fa-solid fa-users"></i>
					Friends
				</h2>
				<div class="empty-state">
					<i class="fa-solid fa-user-group empty-state-icon"></i>
					<p class="empty-state-text">No friends yet</p>
				</div>
			</div>
		</div>
	</div>

}
