<ion-header [translucent]="true">
	<ion-toolbar>
		<ion-buttons slot="start">
			<ion-menu-button />
		</ion-buttons>
		<ion-title>Social</ion-title>
	</ion-toolbar>
</ion-header>

<gg-refreshable-content [fullscreen]="true" [onRefresh]="refreshFn">
	<div class="social-page">
		<div class="social-content">
			<div class="social-section">
				<h2 class="section-title">
					<ion-icon name="person-add" />
					Friend Requests
				</h2>
				<div class="empty-state">
					<ion-icon name="file-tray" class="empty-state-icon" />
					<p class="empty-state-text">No pending friend requests</p>
				</div>
			</div>

			<div class="social-section">
				<h2 class="section-title">
					<ion-icon name="people" />
					Friends
				</h2>
				<div class="empty-state">
					<ion-icon name="people" class="empty-state-icon" />
					<p class="empty-state-text">No friends yet</p>
				</div>
			</div>
		</div>
	</div>
</gg-refreshable-content>
