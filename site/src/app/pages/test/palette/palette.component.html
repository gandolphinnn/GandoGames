<div class="test-panel">
	<div class="test-group">
		<span class="test-label">ToastService</span>
		<button class="btn btn-danger btn-sm" (click)="toast.error('Something went wrong on the server.')">Error</button>
		<button class="btn btn-success btn-sm" (click)="toast.success('Operation completed successfully.')">Success</button>
		<button class="btn btn-warning btn-sm" (click)="toast.warning('Proceed with caution.')">Warning</button>
		<button class="btn btn-info btn-sm" (click)="toast.show('Here is some info.')">Info</button>
		<button class="btn btn-info btn-sm" (click)="testProgress()">Progress (3s)</button>
		<button class="btn btn-primary btn-sm" (click)="testYesNo()">Yes / No</button>
	</div>
</div>

<div class="palette-split">

	<!-- Light half -->
	<div class="palette-half" data-theme="light">
		<ng-container *ngTemplateOutlet="halfContent; context: { $implicit: 'light' }"></ng-container>
	</div>

	<div class="split-divider"></div>

	<!-- Dark half -->
	<div class="palette-half" data-theme="dark">
		<ng-container *ngTemplateOutlet="halfContent; context: { $implicit: 'dark' }"></ng-container>
	</div>

</div>

<ng-template #halfContent let-theme>
	<div class="half-header">
		@if (theme === 'light') {
			<ion-icon name="sunny" /> Light — pine/oak
		} @else {
			<ion-icon name="moon" /> Dark — walnut
		}
	</div>

	@for (section of sections; track section.title) {
		<div class="section-label">{{ section.title }}</div>

		@for (swatch of section.swatches; track swatch.name) {
			<div class="swatch-row">
				@if (swatch.isShadow) {
					<div class="shadow-demo"
						[style.background]="'var(--bg-card)'"
						[style.box-shadow]="getValue(swatch, theme)">
					</div>
				} @else {
					<div class="swatch-wrap">
						<div class="swatch" [style.background]="swatch.cssRef"></div>
					</div>
				}
				<div class="swatch-info">
					<span class="swatch-name">{{ swatch.name }}</span>
					<span class="swatch-value">{{ getValue(swatch, theme) }}</span>
				</div>
			</div>
		}
	}
</ng-template>
